project:
  output:
    type: lib

  language-CPP: gnu++17

  define:
    - CSP4CMSIS_MAX_SYSCALL_INTERRUPT_PRIORITY: 5

  components:
    - component: ARM::CMSIS:CORE
    - component: ARM::CMSIS:OS Tick:SysTick
    - component: ARM::CMSIS:RTOS2:FreeRTOS&Cortex-M
    - component: ARM::RTOS&FreeRTOS:Config&CMSIS RTOS2
    - component: ARM::RTOS&FreeRTOS:Core&Cortex-M
    - component: ARM::RTOS&FreeRTOS:Event Groups
    - component: ARM::RTOS&FreeRTOS:Heap&Heap_4
    - component: ARM::RTOS&FreeRTOS:Timers
    - component: OliverFaust::CSP4CMSIS:Core

  groups:
    - group: API reference examples
      misc:
        - CPP:
            - -Wall
            - -Wextra
            - -Werror
      files:
        - file: ../examples/01_intro.cpp
        - file: ../examples/02_s3.cpp
        - file: ../examples/04_s3.cpp
        - file: ../examples/05_s3.cpp
        - file: ../examples/06_s4.cpp
        - file: ../examples/08_s5.cpp
        - file: ../examples/09_s5.cpp
        - file: ../examples/10_s6.cpp
        - file: ../examples/11_s6.cpp
        - file: ../examples/12_s6.cpp
        - file: ../examples/13_s7.cpp
